<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;width:720px;height:1280px;overflow:hidden;font-family:'Inter',sans-serif}
  #stage{position:relative;width:720px;height:1280px;overflow:hidden}
  #art{position:absolute;inset:0}
  .ov{position:absolute;left:0;right:0;text-align:center}
  #head{top:300px;font-weight:900;font-size:64px;color:#ff3030;letter-spacing:1px;padding:0 30px;
        text-shadow:0 0 30px rgba(255,0,0,.45),0 4px 0 rgba(0,0,0,.7)}
  #cap{top:968px;font-weight:900;font-size:58px;line-height:1.06;color:#fff;padding:0 30px;
       -webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.55)}
  #cap .on{color:#ffd23f}
  #cap .red{color:#ff3434}
  #box{left:36px;right:36px;top:150px;text-align:left}
  #box .who{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:17px;letter-spacing:1.5px;margin:0 0 8px 2px;display:flex;align-items:center;gap:8px}
  #box .who i{display:inline-block;width:9px;height:9px;border-radius:50%}
  #box .txt{display:inline-block;background:rgba(6,8,12,.86);border-left:6px solid;padding:15px 22px;
            font-weight:800;font-size:27px;color:#fff;line-height:1.32;border-radius:4px;max-width:610px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #stamp{top:1226px;right:26px;left:auto;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:rgba(235,235,235,.7)}
  #grain{position:absolute;inset:-64px;opacity:.075;mix-blend-mode:overlay;pointer-events:none}
  #fade{position:absolute;inset:0;background:#000;pointer-events:none}
  #flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
</style></head>
<body><div id="stage">
  <svg id="art" width="720" height="1280" viewBox="0 0 720 1280"></svg>
  <div id="grain"></div>
  <div id="head" class="ov"></div>
  <div id="box" class="ov"></div>
  <div id="cap" class="ov"></div>
  <div id="stamp" class="ov"></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>
<script>
const W = 720, H = 1280;
const O = (w = 4, c = '#0b0e16') => `stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const up = s => s.toLocaleUpperCase('tr-TR');
const f1 = v => v.toFixed(1);
let TL = null;

/* ---------- ortak tanımlar ---------- */
const DEFS = `<defs>
  <radialGradient id="vig" cx="50%" cy="46%" r="72%"><stop offset="52%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".82"/></radialGradient>
  <radialGradient id="gCyan"><stop offset="0" stop-color="#7fe3ff" stop-opacity=".6"/><stop offset="1" stop-color="#7fe3ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="gWarm"><stop offset="0" stop-color="#ffcf87" stop-opacity=".7"/><stop offset="1" stop-color="#ffcf87" stop-opacity="0"/></radialGradient>
  <radialGradient id="gOrange"><stop offset="0" stop-color="#ffb35c" stop-opacity=".75"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient>
  <radialGradient id="gRed"><stop offset="0" stop-color="#ff2b2b" stop-opacity=".85"/><stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/></radialGradient>
  <radialGradient id="gBlue"><stop offset="0" stop-color="#2b6bff" stop-opacity=".85"/><stop offset="1" stop-color="#2b6bff" stop-opacity="0"/></radialGradient>
  <radialGradient id="gWhite"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="skyN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04070f"/><stop offset=".7" stop-color="#16213a"/><stop offset="1" stop-color="#2a3550"/></linearGradient>
  <linearGradient id="snowG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab6cb"/><stop offset="1" stop-color="#6d7a93"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></linearGradient>
  <linearGradient id="lampCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffbe6b" stop-opacity=".45"/><stop offset="1" stop-color="#ffbe6b" stop-opacity="0"/></linearGradient>
  <linearGradient id="flash" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff9e0" stop-opacity=".6"/><stop offset="1" stop-color="#fff9e0" stop-opacity="0"/></linearGradient>
  <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#7c1d06"/></linearGradient>
  <linearGradient id="scrG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1626"/><stop offset="1" stop-color="#07101c"/></linearGradient>
  <linearGradient id="wallC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2434"/><stop offset="1" stop-color="#2a3448"/></linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.6" fill="#000" opacity=".22"/></pattern>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#1d3b4f" stroke-width="1"/></pattern>
  <filter id="b3"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="b8"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="b16"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="b30"><feGaussianBlur stdDeviation="30"/></filter>
</defs>`;

/* ---------- yardımcılar ---------- */
function snow(t, n, vx = -20, seed = 0, ymax = H) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const k = i + seed, d = .35 + rnd(k * 3.1) * .9;
    const x = (((rnd(k) * (W + 80) + (vx * d + Math.sin(t * .8 + k) * 10) * t) % (W + 80)) + W + 80) % (W + 80) - 40;
    const y = (rnd(k + 77) * ymax + (45 + 85 * d) * t) % ymax;
    s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(.9 + d * 2.4)}" fill="#fff" opacity="${(.3 + d * .55).toFixed(2)}"/>`;
  }
  return s;
}
const treeCache = {};
function tree(seed, x, y, h, col, op = 1) {
  const k = seed + ':' + h;
  if (!treeCache[k]) {
    const paths = [[], [], [], []];
    const br = (x0, y0, a, len, d, s) => {
      const x1 = x0 + Math.sin(a) * len, y1 = y0 - Math.cos(a) * len;
      paths[Math.min(d, 3)].push(`M${f1(x0)} ${f1(y0)} L${f1(x1)} ${f1(y1)}`);
      if (d >= 5 || len < 6) return;
      const n = 2 + (rnd(s) > .6 ? 1 : 0);
      for (let j = 0; j < n; j++) br(x1, y1, a + (rnd(s + j * 7) - .5) * 1.5, len * (.62 + rnd(s + j) * .18), d + 1, s * 1.7 + j * 13.1);
    };
    br(0, 0, (rnd(seed) - .5) * .15, h * .38, 0, seed + 1);
    treeCache[k] = paths;
  }
  const ws = [h * .06, h * .035, h * .018, h * .009];
  return `<g transform="translate(${x} ${y})" stroke="${col}" fill="none" stroke-linecap="round" opacity="${op}">` +
    treeCache[k].map((p, i) => `<path d="${p.join(' ')}" stroke-width="${f1(Math.max(1, ws[i]))}"/>`).join('') + '</g>';
}
function teaGlass(x, y, s, steamT) {
  let st = '';
  if (steamT !== undefined) for (let i = 0; i < 3; i++) {
    const ph = (steamT * .35 + i / 3) % 1;
    st += `<path d="M${x - 10 + i * 10} ${y - 70 * s - ph * 80} q12 -18 0 -36 q-12 -18 0 -36" fill="none" stroke="#fff" stroke-width="${3 * s}" opacity="${(.28 * Math.sin(ph * Math.PI)).toFixed(2)}" stroke-linecap="round"/>`;
  }
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="8" rx="46" ry="11" fill="#d9dde3" ${O(3)}/>
    <path d="M-22 4 Q-30 -20 -16 -38 Q-26 -56 -24 -74 L24 -74 Q26 -56 16 -38 Q30 -20 22 4 Z" fill="url(#tea)" ${O(3)}/>
    <path d="M-23 -74 L23 -74 L22 -64 L-22 -64 Z" fill="#fde7c8" opacity=".55"/>
    <path d="M-14 -66 Q-18 -50 -10 -38" fill="none" stroke="#fff" stroke-width="3" opacity=".45" stroke-linecap="round"/>
  </g>${st}`;
}
function ambulance(x, y, s, t, lights = true, moving = false, snowRoof = false) {
  const lb = lights ? (Math.floor(t * 6) % 2) : -1;
  const spin = moving ? (t * 520) % 360 : 0;
  const wheel = cx => `<g transform="translate(${cx} -34)"><circle r="36" fill="#15171c" ${O(4)}/><circle r="18" fill="#9aa1ac" ${O(3)}/>
      <g transform="rotate(${spin})"><line x1="-16" y1="0" x2="16" y2="0" stroke="#5c636e" stroke-width="4"/><line x1="0" y1="-16" x2="0" y2="16" stroke="#5c636e" stroke-width="4"/></g><circle r="5" fill="#2a2e35"/></g>`;
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="215" cy="2" rx="240" ry="14" fill="#000" opacity=".35"/>
    <path d="M0 -40 L0 -208 Q0 -216 9 -216 L292 -216 L330 -210 L382 -132 L424 -114 Q432 -110 432 -96 L432 -40 Z" fill="#f2f4f7" ${O(5)}/>
    <path d="M300 -200 L328 -200 L370 -134 L300 -134 Z" fill="#203048" ${O(3)}/>
    <path d="M306 -194 L326 -194 L344 -166 L306 -166 Z" fill="#3c5574" opacity=".7"/>
    <rect x="232" y="-196" width="56" height="58" rx="5" fill="#203048" ${O(3)}/>
    <rect x="2" y="-112" width="428" height="24" fill="#d62828"/><rect x="2" y="-84" width="428" height="7" fill="#1d4ed8"/>
    <text x="72" y="-138" font-weight="900" font-size="38" fill="#d62828">112</text>
    <text x="146" y="-138" font-weight="900" font-size="28" fill="#1f2937">ACİL</text>
    <g transform="translate(40 -152) scale(.75)" fill="#1d4ed8"><rect x="-5" y="-22" width="10" height="44" rx="2"/><rect x="-5" y="-22" width="10" height="44" rx="2" transform="rotate(60)"/><rect x="-5" y="-22" width="10" height="44" rx="2" transform="rotate(-60)"/></g>
    <line x1="226" y1="-208" x2="226" y2="-44" stroke="#0b0e16" stroke-width="3"/><line x1="10" y1="-208" x2="10" y2="-44" stroke="#0b0e16" stroke-width="2"/>
    <path d="M40 -40 A44 44 0 0 1 128 -40 Z M296 -40 A44 44 0 0 1 384 -40 Z" fill="#2b2f37"/>
    ${wheel(84)}${wheel(340)}
    <rect x="420" y="-104" width="12" height="16" rx="3" fill="#fff3b0" ${O(2)}/><rect x="0" y="-170" width="8" height="24" fill="#e11d48"/>
    <rect x="246" y="-230" width="40" height="14" rx="4" fill="${lb === 0 ? '#5aa2ff' : '#1e3a8a'}" ${O(3)}/>
    <rect x="286" y="-230" width="40" height="14" rx="4" fill="${lb === 1 ? '#ff6b6b' : '#7f1d1d'}" ${O(3)}/>
    ${lb === 0 ? `<circle cx="266" cy="-223" r="70" fill="url(#gBlue)" opacity=".8"/>` : ''}${lb === 1 ? `<circle cx="306" cy="-223" r="70" fill="url(#gRed)" opacity=".8"/>` : ''}
    ${snowRoof ? `<path d="M2 -216 Q60 -232 150 -226 Q240 -234 290 -218 L292 -214 L2 -214 Z" fill="#eef3fa" ${O(3)}/>` : ''}
  </g>`;
}
function lampPost(x, y, h, t) {
  const fl = .9 + .1 * Math.sin(t * 37) * (rnd(Math.floor(t * 4)) > .85);
  return `<polygon points="${x - 40},${y - h + 14} ${x - 240},${y + 10} ${x + 160},${y + 10} ${x - 10},${y - h + 14}" fill="url(#lampCone)" opacity="${.9 * fl}"/>
    <ellipse cx="${x - 40}" cy="${y + 8}" rx="190" ry="34" fill="url(#gOrange)" opacity="${.6 * fl}"/>
    <rect x="${x - 5}" y="${y - h}" width="10" height="${h}" fill="#1a1f2b" ${O(3)}/>
    <path d="M${x} ${y - h + 6} Q${x - 10} ${y - h - 24} ${x - 40} ${y - h - 10}" fill="none" stroke="#1a1f2b" stroke-width="8" stroke-linecap="round"/>
    <path d="M${x - 62} ${y - h - 6} L${x - 18} ${y - h - 6} L${x - 26} ${y - h + 10} L${x - 54} ${y - h + 10} Z" fill="#2a3040" ${O(3)}/>
    <ellipse cx="${x - 40}" cy="${y - h + 10}" rx="16" ry="5" fill="#ffe2a8"/>
    <circle cx="${x - 40}" cy="${y - h + 10}" r="60" fill="url(#gOrange)" opacity="${fl}"/>`;
}

/* ---------- karakter parçaları ---------- */
function selinBack(cx, cy, s, t) {   // arkadan görünüş, kulaklıklı
  return `<g transform="translate(${cx} ${cy}) scale(${s})">
    <path d="M-150 260 Q-150 120 -60 100 L60 100 Q150 120 150 260 Z" fill="#1e2a45" ${O(4)}/>
    <path d="M-22 96 L22 96 L26 120 L-26 120 Z" fill="#c99a78"/>
    <path d="M-78 30 Q-92 -60 -40 -88 Q0 -104 40 -88 Q92 -60 78 30 Q84 90 60 128 L-60 128 Q-84 90 -78 30 Z" fill="#4a2f22" ${O(4)}/>
    <path d="M-40 -70 Q-10 -20 -24 80 M10 -86 Q20 -10 12 100 M48 -60 Q50 20 40 96" fill="none" stroke="#3a2419" stroke-width="3"/>
    <path d="M-84 -10 Q-80 -110 0 -114 Q80 -110 84 -10" fill="none" stroke="#22252c" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="-84" cy="0" rx="16" ry="26" fill="#1b1d23" ${O(3)}/><ellipse cx="84" cy="0" rx="16" ry="26" fill="#1b1d23" ${O(3)}/>
    <path d="M-84 20 Q-110 60 -70 90" fill="none" stroke="#22252c" stroke-width="5" stroke-linecap="round"/>
    <path d="M78 -40 Q88 0 74 50" fill="none" stroke="#7fe3ff" stroke-width="5" opacity=".45" stroke-linecap="round"/>
  </g>`;
}
function hakanSmall(cx, cy, s, t) {   // arka masada, yandan
  const sip = (t % 7) < 1.4 ? 1 : 0;
  return `<g transform="translate(${cx} ${cy}) scale(${s})">
    <rect x="-46" y="10" width="20" height="120" rx="6" fill="#111318" ${O(3)}/>
    <path d="M-40 130 Q-60 40 -20 10 L30 10 Q56 40 50 130 Z" fill="#6b6f78" ${O(4)}/>
    <circle cx="0" cy="-26" r="34" fill="#d8a886" ${O(4)}/>
    <path d="M-30 -40 Q-26 -66 6 -62 Q30 -58 32 -36 Q20 -48 4 -50 Q-14 -50 -30 -40 Z" fill="#c9ccd1" ${O(3)}/>
    <path d="M-34 -30 Q-38 -10 -26 -4" fill="#c9ccd1" ${O(2)}/>
    <rect x="-34" y="-34" width="18" height="12" rx="3" fill="#bfe8ff" fill-opacity=".35" ${O(2.5, '#2a2a2a')}/>
    <path d="M-36 -10 Q-24 -2 -12 -10" fill="#c9ccd1" ${O(2)}/>
    <g transform="translate(${sip ? -30 : -48} ${sip ? -14 : 40})">${teaGlass(0, 0, .45)}</g>
    <path d="M-20 40 Q-44 ${sip ? 0 : 40} ${sip ? -36 : -52} ${sip ? -10 : 40}" fill="none" stroke="#0b0e16" stroke-width="20" stroke-linecap="round"/>
    <path d="M-20 40 Q-44 ${sip ? 0 : 40} ${sip ? -36 : -52} ${sip ? -10 : 40}" fill="none" stroke="#6b6f78" stroke-width="13" stroke-linecap="round"/>
  </g>`;
}
function rizaSide(cx, cy, s, t) {   // Selin'in yanında oturuyor, 3/4 arkadan
  return `<g transform="translate(${cx} ${cy}) scale(${s})">
    <path d="M-120 280 Q-130 120 -60 96 L70 96 Q140 120 130 280 Z" fill="#1b2540" ${O(4)}/>
    <path d="M-120 200 Q-125 120 -60 96 L70 96 Q138 120 132 200 Z" fill="#b3202a"/>
    <rect x="-124" y="190" width="258" height="18" fill="#cfd8e3" opacity=".9"/>
    <path d="M-120 280 Q-130 120 -60 96 L70 96 Q140 120 130 280 Z" fill="none" ${O(4)}/>
    ${[...Array(9)].map((_, i) => `<circle cx="${-90 + i * 22}" cy="${104 + (i % 3) * 6}" r="${2 + (i % 2)}" fill="#fff" opacity=".9"/>`).join('')}
    <circle cx="0" cy="20" r="72" fill="#c99a78" ${O(4)}/>
    <path d="M-72 14 Q-74 -54 0 -56 Q74 -54 72 14 Q60 -18 30 -24 Q-30 -26 -72 14 Z" fill="#17171c" ${O(3)}/>
    <path d="M44 30 Q70 40 66 70 Q54 92 24 90" fill="#2a2522" opacity=".95"/>
    <ellipse cx="70" cy="22" rx="10" ry="16" fill="#c99a78" ${O(3)}/>
  </g>`;
}

/* ---------- ekran arayüzü ---------- */
function uiFrame(inner, t, title = 'KARAAĞAÇ 112 · ÇAĞRI YÖNETİM SİSTEMİ', clock = '03:00:00') {
  return `<rect width="720" height="1280" fill="#0b0d12"/>
    <rect x="18" y="60" width="684" height="1150" rx="22" fill="#14161c" ${O(5)}/>
    <rect x="40" y="82" width="640" height="1080" rx="8" fill="url(#scrG)"/>
    <rect x="40" y="82" width="640" height="56" fill="#0f2238"/>
    <circle cx="66" cy="110" r="9" fill="#ef4444"/><text x="86" y="117" font-family="JetBrains Mono" font-weight="800" font-size="17" fill="#cfe8ff">${title}</text>
    <text x="664" y="117" text-anchor="end" font-family="JetBrains Mono" font-weight="700" font-size="17" fill="#7fb4dd">${clock}</text>
    ${inner}
    <rect x="40" y="82" width="640" height="1080" fill="url(#scan)"/>
    <polygon points="40,82 330,82 40,560" fill="#fff" opacity=".035"/>
    <text x="360" y="1192" text-anchor="middle" font-weight="900" font-size="15" fill="#3b4250" letter-spacing="3">112</text>`;
}
function lineList(active, t) {
  const rows = [['HAT 1', active ? 'GELEN' : 'BOŞ'], ['HAT 2', 'BOŞ'], ['HAT 3', 'BOŞ'], ['HAT 4', 'KAPALI']];
  return rows.map((r, i) => {
    const on = i === 0 && active, bl = on && Math.floor(t * 3) % 2;
    return `<rect x="60" y="${168 + i * 70}" width="190" height="56" rx="8" fill="${on ? (bl ? '#7f1d1d' : '#3b0d0d') : '#0f1a2a'}" stroke="${on ? '#ef4444' : '#1f2f45'}" stroke-width="2"/>
      <text x="78" y="${202 + i * 70}" font-family="JetBrains Mono" font-weight="800" font-size="18" fill="#e5f0ff">${r[0]}</text>
      <text x="236" y="${202 + i * 70}" text-anchor="end" font-family="JetBrains Mono" font-weight="700" font-size="14" fill="${on ? '#fca5a5' : '#58708f'}">${r[1]}</text>`;
  }).join('');
}
function phoneIcon(x, y, s, col) {
  return `<path transform="translate(${x} ${y}) scale(${s})" d="M-28 -18 Q-30 -32 -18 -34 L-8 -34 Q-2 -34 0 -26 L4 -12 Q5 -6 0 -2 L-6 2 Q2 18 18 26 L22 20 Q26 15 32 16 L46 20 Q54 22 54 28 L54 38 Q52 50 38 48 Q-24 40 -28 -18 Z" fill="${col}"/>`;
}

/* ---------- sahneler ---------- */
const S = {
  wave(p, t, sc) { return waveScene(t, sc, false); },
  wave2(p, t, sc) { return waveScene(t, sc, true); },
  wave_cut(p, t, sc) { return waveScene(t, sc, false, true); },

  ext(p, t) {
    let win = '';
    [[130, 0], [235, 1], [340, 0], [445, 2]].forEach(([x, k], i) => {
      win += `<rect x="${x}" y="700" width="80" height="96" fill="${k === 1 ? '#bfe9ff' : '#f6d9a0'}" ${O(4)}/>`;
      for (let j = 0; j < 5; j++) win += `<line x1="${x}" y1="${708 + j * 9}" x2="${x + 80}" y2="${708 + j * 9}" stroke="#8a7350" stroke-width="2" opacity=".6"/>`;
      if (k === 1) win += `<rect x="${x + 22}" y="756" width="36" height="22" fill="#0d1b2a"/><circle cx="${x + 40}" cy="748" r="9" fill="#1b2738"/><path d="M${x + 26} 796 Q${x + 40} 760 ${x + 54} 796 Z" fill="#1b2738"/>`;
      win += `<line x1="${x + 40}" y1="700" x2="${x + 40}" y2="796" stroke="#0b0e16" stroke-width="3"/>`;
    });
    let prints = ''; for (let i = 0; i < 9; i++) prints += `<ellipse cx="${500 - i * 34}" cy="${1060 + (i % 2) * 14 + i * 6}" rx="8" ry="4" fill="#5b6780" opacity=".6"/>`;
    return `<rect width="720" height="1280" fill="url(#skyN)"/>
      <ellipse cx="360" cy="640" rx="520" ry="160" fill="#c46a2a" opacity=".1" filter="url(#b30)"/>
      <path d="M0 640 Q120 560 240 610 Q360 540 470 600 Q600 550 720 610 L720 700 L0 700 Z" fill="#101827"/>
      ${tree(3, 40, 690, 150, '#0d1422')}${tree(9, 680, 680, 170, '#0d1422')}
      <rect x="0" y="880" width="720" height="400" fill="url(#snowG)"/>
      <path d="M0 880 Q180 862 360 878 Q540 892 720 872 L720 900 L0 900 Z" fill="#c4cfdf"/>
      <rect x="80" y="660" width="500" height="250" fill="#7d838e" ${O(5)}/>
      <rect x="80" y="660" width="500" height="250" fill="#000" opacity=".18"/>
      <rect x="66" y="640" width="528" height="24" fill="#5c626d" ${O(4)}/>

function captionFor(sc, t) {
  const ws = sc.words; if (!ws.length || sc.nocap) return '';
  const chunks = []; let cur = [];
  ws.forEach((w, i) => {
    cur.push(i);
    const len = cur.reduce((a, j) => a + ws[j].w.length, 0);
    const nextGap = i + 1 < ws.length ? ws[i + 1].s - w.e : 0;
    if (cur.length >= 3 || /[.,?!:…]$/.test(w.w) || len > 14 || nextGap > .3) { chunks.push(cur); cur = []; }
  });
  if (cur.length) chunks.push(cur);
  let ci = -1; chunks.forEach((c, k) => { if (t >= ws[c[0]].s - .05) ci = k; });
  if (ci < 0) return '';
  const c = chunks[ci], last = ws[c[c.length - 1]];
  if (t > last.e + .7) return '';
  return c.map(j => { const w = ws[j]; const txt = up(w.w.replace(/[.,?!:;…]+$/, '').replace(/^\.+/, ''));
    return `<span class="${w.red ? 'red' : (t >= w.s - .03 ? 'on' : '')}">${txt}</span>`; }).join(' ');
}

const grainEl = document.getElementById('grain');
(() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); grainEl.style.backgroundImage = `url(${c.toDataURL()})`; })();

function render(t) {
  const scs = TL.scenes;
  let sc = scs[scs.length - 1], idx = scs.length - 1;
  for (let i = 0; i < scs.length; i++) if (t < scs[i].end) { sc = scs[i]; idx = i; break; }
  const p = clamp((t - sc.start) / (sc.end - sc.start));
  const push = ['ext', 'ruin', 'road', 'black', 'choice', 'turn', 'office', 'office_riza', 'map'].includes(sc.v) ? 0 : .045 * p;
  const shake = sc.v === 'turn' && t - sc.start < .25 ? (rnd(Math.floor(t * 50)) - .5) * 14 : 0;
  const pushExt = sc.v === 'ext' || sc.v === 'ruin' ? .07 * p : 0;
  const z = 1 + push + pushExt;
  document.getElementById('art').innerHTML = DEFS +
    `<g transform="translate(${360 + shake} 640) scale(${z}) translate(-360 -640)">${S[sc.v](p, t, sc)}</g>
     <rect width="720" height="1280" fill="url(#vig)"/>`;
  const head = document.getElementById('head');
  const hp = clamp((t - sc.start - .2) / .3);
  head.textContent = sc.head ? up(sc.head) : ''; head.style.opacity = hp; head.style.transform = `scale(${.85 + .15 * hp})`;
  const box = document.getElementById('box');
  const seg = [...sc.segs].reverse().find(sg => sg.who !== 'anlatici' && t >= sg.s - .1);
  if (seg) {
    const live = t <= seg.e + .1;
    box.style.opacity = clamp((t - seg.s + .1) / .2);
    box.innerHTML = `<div class="who" style="color:${seg.color}"><i style="background:${live && Math.floor(t * 3) % 2 ? seg.color : 'transparent'};border:2px solid ${seg.color}"></i>${seg.label}</div>
      <div class="txt" style="border-color:${seg.color}">“${seg.text}”</div>`;
  } else box.innerHTML = '';
  document.getElementById('cap').innerHTML = captionFor(sc, t);
  document.getElementById('stamp').textContent = sc.stamp ? '◷ ' + sc.stamp : '';
  grainEl.style.backgroundPosition = `${Math.floor(rnd(Math.floor(t * 24)) * 256)}px ${Math.floor(rnd(Math.floor(t * 24) + 9) * 256)}px`;
  const d0 = t - sc.start, d1 = sc.end - t;
  let f = 0;
  if (idx > 0 && d0 < .12) f = 1 - d0 / .12;
  if (idx < scs.length - 1 && d1 < .12) f = Math.max(f, 1 - d1 / .12);
  if (idx === 0 && d0 < .5) f = 1 - d0 / .5;
  if (idx === scs.length - 1 && d1 < .9) f = Math.max(f, 1 - d1 / .9);
  if (t > TL.total - .5) f = 1;
  document.getElementById('fade').style.opacity = clamp(f);
  const fl = (['screen_ring', 'turn', 'wave2'].includes(sc.v) && d0 < .18) ? (1 - d0 / .18) * .5 : 0;
  document.getElementById('flash').style.opacity = fl;
}
window.setTL = tl => { TL = tl; };
